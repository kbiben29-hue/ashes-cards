name: Fetch extras (decks, precons, Red Rains images)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-extra.yml', 'tools/**']

permissions:
  contents: write

jobs:
  extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/fetch-extra.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data images
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Extra Ashes data: deck popularity, precons, Red Rains images" && git pull --rebase && git push; fi
