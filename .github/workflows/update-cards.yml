name: Update Ashes cards

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Also download card images"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [".github/workflows/update-cards.yml", "scripts/**"]
  schedule:
    - cron: "17 9 * * 1" # every Monday

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download cards from ashes.live
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.images }}" != "true" ]; then
            node scripts/fetch-cards.mjs
          else
            node scripts/fetch-cards.mjs --images
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data images 2>/dev/null || git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Ashes card data"
            git push
          fi
